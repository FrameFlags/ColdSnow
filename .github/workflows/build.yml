name: Cold Snow build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          gradle-version: '8.14.5'

      - name: Validate project layout
        run: |
          test -f settings.gradle || (echo "settings.gradle missing" && exit 1)
          test -f build.gradle || (echo "build.gradle missing" && exit 1)
          test -f src/main/resources/META-INF/mods.toml || (echo "mods.toml missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f THIRD_PARTY_NOTICES.md || (echo "THIRD_PARTY_NOTICES.md missing" && exit 1)

      - name: Build and test (CI only — never local)
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify product jar
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/coldsnow-1.20.1-forge-*.jar | grep -v -- '-sources.jar' | head -n 1)
          test -n "$JAR" || (echo "no product jar" && exit 1)
          test -s "$JAR" || (echo "empty product jar" && exit 1)
          unzip -l "$JAR" | grep -q '\.class' || (echo "no classes in jar" && exit 1)
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'coldsnow' || (echo "mods.toml missing from jar" && exit 1)
          echo "Product jar: $JAR"

      - name: Upload product jar and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldsnow-1.20.1-forge
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
          if-no-files-found: warn
